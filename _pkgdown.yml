url: https://talesalonso1996-ops.github.io/pofanalise/
lang: pt
destination: docs

home:
  title: Atlas da POF Harmonizada
  description: Pacote R pofanalise e análises do orçamento das famílias com as cinco edições harmonizadas da POF (1987-2018).

template:
  bootstrap: 5
  bslib:
    primary: "#1c5cab"
    base_font: {google: "IBM Plex Sans"}
    heading_font: {google: "Archivo"}
    code_font: {google: "IBM Plex Mono"}
  includes:
    after_body: |
      <div id="aviso-harmo" role="note" style="background:#fbece7;color:#13202c;border-left:4px solid #b23c22;border-radius:4px;padding:10px 16px;margin:0 0 18px;font-size:.92rem;line-height:1.45">
        <b>Aviso:</b> a harmonização v2 de produtos tem erros de classificação conhecidos (condomínio, compra de imóveis, celular e outros).
        Até que sejam corrigidos na origem, o pacote e todas as análises deste site usam correções provisórias.
        <a href="https://talesalonso1996-ops.github.io/pofanalise/articles/erros-harmonizacao.html" style="color:#8a2a14;font-weight:600">Veja a lista e o efeito de cada correção</a>.
      </div>
      <script>(function(){var a=document.getElementById("aviso-harmo"),m=document.querySelector("main");if(a&&m)m.insertBefore(a,m.firstChild);})();</script>

